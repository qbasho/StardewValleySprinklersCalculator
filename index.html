<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SV Sprinklers Calculator</title>
    <link rel="icon" href="https://stardewvalleywiki.com/mediawiki/images/9/90/Iridium_Sprinkler.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
    <link rel="stylesheet" href="./style.css">
    <script src="lang.js"></script>
</head>
<body>

    <a href="https://x.com/qbasho" target="_blank" class="author-link">by @qbasho</a>

    <div class="box panel" id="planner">
        <h1 data-i18n="title">Sprinklers Calculator</h1>
        
        <div class="opt">
            <label class="check-lbl btn-anim">
                <input type="checkbox" id="nozzle" onchange="calc()">
                <span data-i18n="nozzle">Nozzles</span>
            </label>
            <div class="meta" data-i18n="sub">(Info)</div>
        </div>

        <div class="opt" style="margin-top: 5px;">
            <label class="check-lbl btn-anim">
                <input type="checkbox" id="reverseMode" onchange="toggleReverseMode()">
                <span data-i18n="reverseMode">Reverse Mode</span>
            </label>
            <div class="meta" id="auto-calculate" data-i18n="autoCalculate">Auto-calculate</div>
        </div>

        <div class="row" id="r-basic">
            <div class="grp">
                <img src="https://stardewvalleywiki.com/mediawiki/images/0/08/Sprinkler.png" class="icon" alt="Basic Sprinkler">
                <div class="text-col">
                    <span class="name" data-i18n="basic">Basic</span>
                    <span class="meta" id="m-basic">...</span>
                </div>
            </div>
            <div class="right-grp">
                <button class="rst-btn" id="btn-basic" onclick="clr('i-basic')">X</button>
                <input type="number" id="i-basic" min="0" max="999" inputmode="numeric" oninput="v(this); calc()" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
            </div>
        </div>

        <div class="row" id="r-quality">
            <div class="grp">
                <img src="https://stardewvalleywiki.com/mediawiki/images/a/af/Quality_Sprinkler.png" class="icon" alt="Quality Sprinkler">
                <div class="text-col">
                    <span class="name" data-i18n="quality">Quality</span>
                    <span class="meta" id="m-quality">...</span>
                </div>
            </div>
            <div class="right-grp">
                <button class="rst-btn" id="btn-quality" onclick="clr('i-quality')">X</button>
                <input type="number" id="i-quality" min="0" max="999" inputmode="numeric" oninput="v(this); calc()" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
            </div>
        </div>

        <div class="row" id="r-iridium">
            <div class="grp">
                <img src="https://stardewvalleywiki.com/mediawiki/images/9/90/Iridium_Sprinkler.png" class="icon" alt="Iridium Sprinkler">
                <div class="text-col">
                    <span class="name" data-i18n="iridium">Iridium</span>
                    <span class="meta" id="m-iridium">...</span>
                </div>
            </div>
            <div class="right-grp">
                <button class="rst-btn" id="btn-iridium" onclick="clr('i-iridium')">X</button>
                <input type="number" id="i-iridium" min="0" max="999" inputmode="numeric" oninput="v(this); calc()" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
            </div>
        </div>

        <div class="row" id="r-reverse" style="display: none;">
            <div class="grp">
                <img src="https://stardewvalleywiki.com/mediawiki/images/1/1b/Carrot_Stage_4.png" class="icon" alt="Tiles">
                <div class="text-col">
                    <span class="name" data-i18n="howManyTiles">How many tiles?</span>
                    <span class="meta" id="m-reverse" data-i18n="targetCoverage">Enter the number of tiles to be watered</span>
                </div>
            </div>
            <div class="right-grp">
                <button class="rst-btn" id="btn-reverse" onclick="clr('i-reverse')">X</button>
                <input type="number" id="i-reverse" min="0" max="9999" inputmode="numeric" oninput="v(this); calc()" onkeypress="return event.charCode >= 48 && event.charCode <= 57">
            </div>
        </div>

        <div class="opt" id="reverse-options" style="display: none;">
            <div id="used-sprinklers" style="font-size: 1.2rem; margin-bottom: 10px; color: #5c3a21; text-align: center; text-transform: uppercase;" data-i18n="usedSprinklers">Used sprinklers</div>
            <div style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 10px;">
                <label class="check-lbl btn-anim" style="font-size: 1.1rem; padding: 4px 8px;">
                    <input type="checkbox" id="rev-iridium" checked onchange="calc()">
                    <span data-i18n="iridium">Iridium</span>
                </label>
                <label class="check-lbl btn-anim" style="font-size: 1.1rem; padding: 4px 8px;">
                    <input type="checkbox" id="rev-quality" checked onchange="calc()">
                    <span data-i18n="quality">Quality</span>
                </label>
                <label class="check-lbl btn-anim" style="font-size: 1.1rem; padding: 4px 8px;">
                    <input type="checkbox" id="rev-basic" checked onchange="calc()">
                    <span data-i18n="basic">Basic</span>
                </label>
            </div>
        </div>

        <div class="res" id="total">
            <div id="total-title" data-i18n="total">Total:</div>
            <div class="total" id="sum">0</div>
            <div class="res-list" id="resList" data-i18n="wait">...</div>
        </div>
    </div>

    <div class="box fab" onclick="toggleModal(true)">🌍</div>

    <div class="modal" id="langModal">
        <div class="box menu">
            <div style="text-align:center; border-bottom:2px dashed #a35d28; margin-bottom:10px; font-size:1.8rem; color:#8b0000">
                LANGUAGE
            </div>
            <button class="lang-btn btn-anim" onclick="setLang('en')">🇺🇸 English</button>
            <button class="lang-btn btn-anim" onclick="setLang('pl')">🇵🇱 Polski</button>
            <button class="lang-btn btn-anim" onclick="setLang('de')">🇩🇪 Deutsch</button>
            <button class="lang-btn btn-anim" onclick="setLang('es')">🇪🇸 Español</button>
            <button class="lang-btn btn-anim close" onclick="toggleModal(false)" data-i18n="close">Close</button>
        </div>
    </div>

    <script>
        let cur = 'en';
        let isReverseMode = false;
        
        const cfg = { basic: 4, quality: 8, iridium: 24 };
        const mats = {
            copper:  { img: "f/f1/Copper_Bar.png", key: "copper" },
            iron:    { img: "6/6c/Iron_Bar.png", key: "iron" },
            gold:    { img: "4/4e/Gold_Bar.png", key: "gold" },
            quartz:  { img: "9/98/Refined_Quartz.png", key: "quartz" },
            iri_bar: { img: "c/c4/Iridium_Bar.png", key: "iri_bar" },
            battery: { img: "2/25/Battery_Pack.png", key: "battery" }
        };
        const wikiBase = "https://stardewvalleywiki.com/mediawiki/images/";

        const v = (e) => { 
            e.value = e.value.replace(/\D/g, ''); 
            if (Number(e.value) > 9999) { e.value = 9999; }
        };

        const clr = (id) => {
            document.getElementById(id).value = ''; 
            calc();
        };

        function getPluralName(lang, count, translationData) {
            if (typeof translationData === 'string') return translationData;
            if (lang === 'pl') {
                if (count === 1) return translationData[0]; 
                const mod10 = count % 10;
                const mod100 = count % 100;
                if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return translationData[1];
                return translationData[2] || translationData[1];
            }
            return count === 1 ? translationData[0] : (translationData[1] || translationData[0]);
        }

        function setLang(l) {
            cur = l;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                if (dictionary[cur] && dictionary[cur][el.dataset.i18n]) {
                    el.innerText = dictionary[cur][el.dataset.i18n];
                }
            });
            calc();
            toggleModal(false);
        }

        function toggleModal(s) {
            const m = document.getElementById('langModal');
            s ? m.classList.add('open') : m.classList.remove('open');
        }

        function toggleReverseMode() {
            isReverseMode = document.getElementById('reverseMode').checked;
            
            const displayStandard = isReverseMode ? 'none' : 'flex';
            const displayReverse = isReverseMode ? 'flex' : 'none';

            document.getElementById('r-basic').style.display = displayStandard;
            document.getElementById('r-quality').style.display = displayStandard;
            document.getElementById('r-iridium').style.display = displayStandard;
            
            document.getElementById('r-reverse').style.display = displayReverse;
            document.getElementById('reverse-options').style.display = isReverseMode ? 'block' : 'none';

            const totalTitleElement = document.getElementById('total-title');
            
            if (isReverseMode) {
                totalTitleElement.dataset.i18n = 'youNeed';
            } else {
                totalTitleElement.dataset.i18n = 'total';
            }
            
            if (dictionary[cur] && dictionary[cur][totalTitleElement.dataset.i18n]) {
                totalTitleElement.innerText = dictionary[cur][totalTitleElement.dataset.i18n];
            }
            
            calc();
        }

        function calc() {
            const boost = document.getElementById('nozzle').checked;
            let b = 0, q = 0, i = 0;
            let totalTiles = 0;
            let totalSprinklers = 0;

            if (isReverseMode) {
                const targetTiles = parseInt(document.getElementById('i-reverse').value) || 0;
                document.getElementById('btn-reverse').classList.toggle('show', targetTiles > 0);
                
                const capI = boost ? 48 : 24;
                const capQ = boost ? 24 : 8;
                const capB = boost ? 8 : 4;
                
                const useI = document.getElementById('rev-iridium').checked;
                const useQ = document.getElementById('rev-quality').checked;
                const useB = document.getElementById('rev-basic').checked;

                const available = [];
                if (useI) available.push({ key: 'i', cap: capI });
                if (useQ) available.push({ key: 'q', cap: capQ });
                if (useB) available.push({ key: 'b', cap: capB });

                let remainder = targetTiles;

                if (available.length > 0 && targetTiles > 0) {
                    for (let idx = 0; idx < available.length; idx++) {
                        const isLast = (idx === available.length - 1);
                        const sprinkler = available[idx];
                        
                        if (isLast) {
                            let count = Math.ceil(remainder / sprinkler.cap);
                            if (sprinkler.key === 'i') i = count;
                            if (sprinkler.key === 'q') q = count;
                            if (sprinkler.key === 'b') b = count;
                            remainder = 0;
                        } else {
                            let count = Math.floor(remainder / sprinkler.cap);
                            if (sprinkler.key === 'i') i = count;
                            if (sprinkler.key === 'q') q = count;
                            if (sprinkler.key === 'b') b = count;
                            remainder %= sprinkler.cap; 
                        }
                    }
                }

                totalSprinklers = i + q + b;
                totalTiles = (i * capI) + (q * capQ) + (b * capB);

            } else {
                b = parseInt(document.getElementById('i-basic').value) || 0;
                q = parseInt(document.getElementById('i-quality').value) || 0;
                i = parseInt(document.getElementById('i-iridium').value) || 0;

                document.getElementById('btn-basic').classList.toggle('show', b > 0);
                document.getElementById('btn-quality').classList.toggle('show', q > 0);
                document.getElementById('btn-iridium').classList.toggle('show', i > 0);

                totalTiles += b * (boost ? 8 : 4);
                const txtB = `${dictionary[cur] && dictionary[cur].range ? dictionary[cur].range : 'Range'}: ${boost ? 8 : 4} ${dictionary[cur] && dictionary[cur].tiles ? dictionary[cur].tiles : 'tiles'}` + (boost ? ` (${dictionary[cur] && dictionary[cur].boost ? dictionary[cur].boost : '+ boost'})` : '');
                document.getElementById('m-basic').innerText = txtB;
                document.getElementById('r-basic').classList.toggle('boost', boost);

                totalTiles += q * (boost ? 24 : 8);
                const txtQ = `${dictionary[cur] && dictionary[cur].range ? dictionary[cur].range : 'Range'}: ${boost ? 24 : 8} ${dictionary[cur] && dictionary[cur].tiles ? dictionary[cur].tiles : 'tiles'}` + (boost ? ` (${dictionary[cur] && dictionary[cur].boost ? dictionary[cur].boost : '+ boost'})` : '');
                document.getElementById('m-quality').innerText = txtQ;
                document.getElementById('r-quality').classList.toggle('boost', boost);

                totalTiles += i * (boost ? 48 : 24);
                const txtI = `${dictionary[cur] && dictionary[cur].range ? dictionary[cur].range : 'Range'}: ${boost ? 48 : 24} ${dictionary[cur] && dictionary[cur].tiles ? dictionary[cur].tiles : 'tiles'}` + (boost ? ` (${dictionary[cur] && dictionary[cur].boost ? dictionary[cur].boost : '+ boost'})` : '');
                document.getElementById('m-iridium').innerText = txtI;
                document.getElementById('r-iridium').classList.toggle('boost', boost);
            }

            const sumEl = document.getElementById('sum');
            sumEl.style.transform = "scale(1.2)";
            setTimeout(() => sumEl.style.transform = "scale(1)", 150);
            sumEl.innerText = isReverseMode ? totalSprinklers : totalTiles;

            const req = { copper: 0, iron: 0, gold: 0, quartz: 0, iri_bar: 0, battery: 0 };
            req.copper += b; 
            req.iron += b;
            req.iron += q; 
            req.gold += q; 
            req.quartz += q;
            req.gold += i; 
            req.iri_bar += i; 
            req.battery += i;

            const resDiv = document.getElementById('resList');
            const targetWaitStr = (dictionary[cur] && dictionary[cur].wait) ? dictionary[cur].wait : '...';
            
            if (isReverseMode ? totalSprinklers === 0 : totalTiles === 0) {
                resDiv.innerText = targetWaitStr;
            } else {
                let htmlParts = [];
                
                if (isReverseMode) {
                    if (i > 0) htmlParts.push(`<span class="res-item"><img src="${wikiBase}9/90/Iridium_Sprinkler.png" class="res-img" alt="Iridium"> <strong>x${i}</strong> <span data-i18n="iridium">${dictionary[cur].iridium}</span></span>`);
                    if (q > 0) htmlParts.push(`<span class="res-item"><img src="${wikiBase}a/af/Quality_Sprinkler.png" class="res-img" alt="Quality"> <strong>x${q}</strong> <span data-i18n="quality">${dictionary[cur].quality}</span></span>`);
                    if (b > 0) htmlParts.push(`<span class="res-item"><img src="${wikiBase}0/08/Sprinkler.png" class="res-img" alt="Basic"> <strong>x${b}</strong> <span data-i18n="basic">${dictionary[cur].basic}</span></span>`);
                    
                    htmlParts.push('<hr style="width: 100%; border: 1px dashed #a35d28; margin: 10px 0;">');
                }

                Object.keys(req).forEach(k => {
                    if (req[k] > 0) {
                        const rawNameData = (dictionary[cur] && dictionary[cur][mats[k].key]) ? dictionary[cur][mats[k].key] : k;
                        const itemName = typeof rawNameData === 'string' ? rawNameData : getPluralName(cur, req[k], rawNameData);
                        
                        htmlParts.push(
                            `<span class="res-item">` +
                            `<img src="${wikiBase}${mats[k].img}" class="res-img" alt="${k}"> ` +
                            `<strong>x${req[k]}</strong> ${itemName}` +
                            `</span>`
                        );
                    }
                });
                resDiv.innerHTML = htmlParts.join(' ');
            }
        }

        if (typeof dictionary !== 'undefined') { setLang('en'); }

        window.addEventListener('load', () => {
            document.querySelectorAll('input[type="number"]').forEach(input => {
                input.value = '';
            });

            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = false;
            });

            toggleReverseMode();
            calc();
        });
    </script>
</body>
</html>
